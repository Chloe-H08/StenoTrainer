<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Markov-chain generated sentences</title>
	<link href="../assets/css/style.css" rel="stylesheet" type="text/css">
	<script src="../scripts/type-jig.js"></script>
	<script src="../scripts/util.js"></script>
	<script src="../scripts/steno-display.js"></script>
	<script src="../data/plover-translations.js"></script>
	<script src="../scripts/chart.js"></script>
	<link rel="stylesheet" type="text/css" href="../assets/css/font-roboto.css">
</head>
<body>

<div id="lesson" class="wrapper">
	<div id="leftside">
		<h3 id="lesson-name" class="center"></h3>
		<div id="drill-content">
			<div id="answer"></div>
			<div id="exercise"></div>
			<div id="results"></div>
		</div>
	</div>

	<textarea id="input"></textarea>

	<div id="nav">
		<p id="strokes"></p>
		<p id="clock" class="clock"></p>
		<p id="live-wpm-display" class="wpm"></p>
		<p class="center"><a id="again" title="Enter">&#8634; Repeat Drill <span class="shortcutkey">(Enter 3x)</span></a></p>
		<p class="center"><a id="back" title="LeftArrow">&larr; Back to Menu <span class="shortcutkey">(LeftArrow)</span></a></p>
		<p class="center"><a id="new" title="RightArrow">&rarr; New Drill <span class="shortcutkey">(RightArrow)</span></a></p>
	</div>
</div>

<script src="../scripts/emilySymbols.js"></script>

</body>
</html>
